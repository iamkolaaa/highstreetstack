<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<title>Do It For The Art · Staff</title>
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.hdr{position:sticky;top:0;z-index:40;background:rgba(10,10,10,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.hdr img{height:34px;width:auto}
main{width:min(760px,100% - 24px);margin:14px auto 0}
h3{font-size:26px;margin:22px 0 8px}
h3 small{font:400 13px var(--ui);color:var(--mute);letter-spacing:.04em}
/* lock */
#lock{position:fixed;inset:0;z-index:100;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto}
#lock img{width:min(280px,70%);margin-bottom:18px}
.dots{display:flex;gap:12px;margin:14px 0 20px;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold);transition:.15s}
.dots i.on{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-bottom:22px}
.pad button{width:76px;height:76px;border-radius:50%;border:1px solid var(--line2);background:radial-gradient(circle at 35% 30%,#2b2b2b,#050505 70%);box-shadow:inset 0 2px 6px rgba(255,255,255,.08),0 8px 18px rgba(0,0,0,.6);font:500 28px var(--ui);cursor:pointer}
.pad button:active{transform:scale(.93);border-color:var(--gold)}
.pad button.s{font-size:15px;color:var(--mute)}
#lock .btn{width:min(264px,100%)}
.err{color:var(--bad);min-height:24px;font-size:14px;margin-bottom:6px}
/* tab bar */
.tabs{position:fixed;inset:auto 0 0;z-index:45;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(10,10,10,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{min-height:64px;background:none;border:0;color:var(--mute);font:500 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tabs button b{font-size:20px;line-height:1}
.tabs button.on{color:var(--gold2)}
/* strip, chips */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.dbtn{flex:none;width:56px;min-height:64px;border-radius:16px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mute)}
.dbtn b{font:500 20px var(--ui);color:var(--text)}
.dbtn.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111;border:0}
.dbtn.on b{color:#111}
.nav2{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.nav2 .grow{flex:1;text-align:center;font:500 22px var(--display)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-size:14px}
.chip.on{background:var(--text);color:#0a0a0a;border-color:var(--text)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sum div{padding:12px 8px;text-align:center}
.sum b{display:block;font:500 24px var(--display);color:var(--gold2)}
.sum span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
/* booking cards */
.bk{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);border-left:4px solid var(--gold)}
.bk.st-completed{border-left-color:var(--ok)}.bk.st-no_show,.bk.st-cancelled,.bk.st-expired{border-left-color:var(--bad);opacity:.7}.bk.st-pending{border-left-color:var(--warn)}
.bk .t{font:500 18px var(--ui)}.bk .n{font-size:17px;margin-top:2px}.bk .m{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--line2);color:var(--mute)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.gold{color:var(--gold2);border-color:var(--gold)}
.grp{font:500 12px var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:18px 0 8px}
.empty{padding:30px 10px;text-align:center;color:var(--mute)}
.fab{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:44;box-shadow:0 10px 30px rgba(0,0,0,.7)}
/* sheet */
#bd{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .25s}
#bd.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--char);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s ease;max-width:760px;margin:0 auto}
#sheet.open{transform:none}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
#sheet h3{margin:4px 0 4px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.acts .btn{padding:0 10px;letter-spacing:.08em;font-size:13px}
.acts .full{grid-column:1/-1}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.wa{background:#1f6b46;border-color:#1f6b46;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.hrow b{width:40px;font-weight:500}.hrow .cl{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute);min-height:44px;margin-right:auto}
.hrow .cl input,.cb input{width:22px;height:22px;accent-color:var(--gold)}
.hrow .in{width:auto;flex:1;min-width:100px}.hrow.shut .in{opacity:.3}
.cb{display:flex;gap:10px;align-items:center;min-height:44px;color:var(--text);font-size:15px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left;cursor:pointer;color:inherit}
.item .l{min-width:0}.item .l div{overflow:hidden;text-overflow:ellipsis}
.item.off{opacity:.5}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.note{padding:12px 14px;border:1px solid var(--line2);border-radius:14px;margin:10px 0;font-size:14px}
.hist{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.sec{padding:16px;margin-bottom:14px}.sec h3{margin-top:0}
.radio{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}
.radio input{width:22px;height:22px;accent-color:var(--gold);flex:none}
.sp{display:flex;justify-content:center;padding:30px}
/* who + roles */
.who{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0}
.who .av{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--gold);background:#1a1a1a;display:grid;place-items:center;font:500 15px var(--display);color:var(--gold2);flex:none;height:32px}
.who span{font:500 13px var(--ui);letter-spacing:.06em;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{padding:0 2px;font-size:10.5px;letter-spacing:.04em;white-space:nowrap}.dm-chip{display:none!important}
/* earnings */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.stat.first{grid-column:1/-1}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(135deg,#1b1b1b,#101010);border:1px solid var(--line2);border-radius:var(--r);position:relative;overflow:hidden}
.stat.first{border-color:var(--gold)}
.stat small{font:500 12px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.stat b{display:block;font:500 40px/1.1 var(--display);color:var(--gold2)}.stat.first b{font-size:60px}
.stat .c{font-size:13px;color:var(--mute)}
.chart{padding:14px 12px 10px}
.rd{font-size:14px;color:var(--mute);min-height:22px;text-align:center;margin-bottom:6px}
.rd b{color:var(--gold2);font:500 22px var(--display)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}
.bcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;background:none;border:0;cursor:pointer;padding:0}
.bar{width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:#3a362d;height:0;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.bcol.today .bar{background:linear-gradient(180deg,var(--gold2),var(--gold))}
.bcol.sel .bar{outline:2px solid var(--text);outline-offset:2px}
.bls{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px;text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.bls .today{color:var(--gold2);font-weight:600}
.lb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;cursor:pointer;color:inherit}
.lb.on{border-color:var(--gold)}
.lb .av{width:46px;height:46px;border-radius:50%;object-fit:cover;border:1px solid var(--gold);flex:none;background:#1a1a1a;display:grid;place-items:center;font:500 20px var(--display);color:var(--gold2)}
.lb .nm{flex:1;min-width:0}.lb .nm b{display:block;font-weight:500;font-size:16px}
.lb .nm span{font-size:12px;color:var(--mute)}
.lb .v{display:grid;grid-template-columns:repeat(3,auto);gap:12px;text-align:right}
.lb .v i{font-style:normal;display:block;font:500 10px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.lb .v em{font:500 18px var(--display);font-style:normal;color:var(--gold2)}
.pr{display:flex;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.pr .l{min-width:0}.pr .l div:first-child{font-weight:500}
.pr .a{font:500 22px var(--display);color:var(--ok);white-space:nowrap}
/* payment overlay */
#pay{position:fixed;inset:0;z-index:200;background:radial-gradient(ellipse at 50% 0,#2a2314 0,#070707 55%),#050505;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));display:none;flex-direction:column;align-items:center;text-align:center}
#pay.open{display:flex;animation:pin .3s ease}
@keyframes pin{from{opacity:0;transform:scale(1.03)}}
#pay .amt{font:500 clamp(68px,22vw,104px)/1 var(--display);color:var(--gold2);margin:6px 0 2px;text-shadow:0 0 40px rgba(201,165,90,.35)}
#pay .sub{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
#pay .qrc{width:fit-content;max-width:100%;background:#fff;border-radius:28px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 0 1px rgba(201,165,90,.5);line-height:0}
#qr img,#qr canvas{width:min(72vw,300px)!important;height:min(72vw,300px)!important;display:block}
#qr canvas{display:none!important}
#qr.noimg canvas{display:block!important}
#pay .olink{font-size:13px;color:var(--gold2);text-decoration:underline;margin-top:12px;display:inline-block}
#pay .who2{margin-top:12px;font-size:16px}#pay .who2 span{color:var(--mute);font-size:14px;display:block}
#pay .wait{margin-top:10px;color:var(--gold2);font-size:15px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#pay .pbt{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(360px,100%);margin-top:auto;padding-top:18px}
#pay .okv{margin:auto;display:flex;flex-direction:column;align-items:center}
#pay .okc{width:min(52vw,210px);height:min(52vw,210px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#7be0a8,#2f9e63);display:grid;place-items:center;box-shadow:0 0 0 12px rgba(95,191,138,.15),0 0 80px rgba(95,191,138,.45);animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
#pay .okc svg{width:60%;height:60%}
#pay .okc path{stroke:#fff;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .35s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#pay .okt{font:500 clamp(48px,15vw,72px)/1 var(--display);margin-top:26px;color:var(--text)}
#pay .okn{font-size:20px;color:var(--gold2);margin-top:8px}
#cf{position:fixed;inset:0;z-index:210;pointer-events:none}
/* banner */
#banner{position:fixed;left:0;right:0;top:0;z-index:500;padding:calc(10px + env(safe-area-inset-top)) 12px 0;transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,1,.3,1);pointer-events:none}
#banner.show{transform:none;pointer-events:auto}
#banner .bn{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111;box-shadow:0 18px 50px rgba(0,0,0,.65);cursor:pointer;text-align:left}
#banner .ic{width:54px;height:54px;border-radius:50%;background:#0a0a0a;display:grid;place-items:center;font-size:26px;flex:none}
#banner b{display:block;font:600 30px/1 var(--display)}
#banner span{display:block;font-size:14px;margin-top:4px;line-height:1.3}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="lock" hidden>
  <img src="img/logo-white.png" alt="Do It For The Art Studio">
  <div class="eyebrow">Staff only</div>
  <div class="dots" id="dots"></div>
  <div class="err" id="lerr"></div>
  <div class="pad" id="pad"></div>
  <button class="btn gold" id="enter">Enter</button>
</div>

<div id="app" hidden>
  <header class="hdr marble"><div class="wrap">
    <img src="img/logo-white.png" alt="Do It For The Art Studio">
    <div class="who" id="who"></div>
    <button class="btn sm" data-act="lock">Lock</button>
  </div></header>
  <main id="main"></main>
  <button class="btn gold fab" id="fab" data-act="walkin">+ Walk-in / phone booking</button>
  <nav class="tabs">
    <button data-act="tab" data-t="diary"><b>&#9986;</b>Diary</button>
    <button data-act="tab" data-t="earn"><b>&pound;</b>Earnings</button>
    <button data-act="tab" data-t="clients"><b>&#9786;</b>Clients</button>
    <button data-act="tab" data-t="menu"><b>&#9776;</b>Menu &amp; team</button>
    <button data-act="tab" data-t="settings"><b>&#9881;</b>Settings</button>
  </nav>
</div>
<div id="pay" role="dialog" aria-modal="true" aria-label="Take payment"></div>
<canvas id="cf" hidden></canvas>
<div id="banner" role="status" aria-live="polite"></div>
<div id="bd" data-act="close"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>

<script src="assets/common.js"></script>
<script>
(() => {
const D = DIFTA, esc = D.esc;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const S = { me: null, pin: "", all: null, tab: "diary", day: D.ymd(), strip: D.ymd(), staff: "all", bk: [], tom: [], showX: false, mode: "barber",
  cust: null, csort: "last", cq: "", due: false, loading: false };
const ST = { pending: ["Awaiting payment", "warn"], confirmed: ["Confirmed", "gold"], completed: ["Completed", "ok"], no_show: ["No-show", "bad"], cancelled: ["Cancelled", "bad"], expired: ["Expired", "bad"] };
const DAYS = [["mon", "Mon"], ["tue", "Tue"], ["wed", "Wed"], ["thu", "Thu"], ["fri", "Fri"], ["sat", "Sat"], ["sun", "Sun"]];
const lsGet = () => { try { return localStorage.getItem("difta_pin") || ""; } catch { return ""; } };
const lsSet = (v) => { try { v ? localStorage.setItem("difta_pin", v) : localStorage.removeItem("difta_pin"); } catch {} };
const call = async (path, o = {}) => {
  try { return await D.api(path, { ...o, pin: S.pin }); }
  catch (e) { if (e.status === 401) lock("Wrong PIN"); throw e; }
};
const busy = async (btn, fn) => {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { D.toast(e.message, true); } finally { if (btn) btn.disabled = false; }
};
const staffName = (id) => (S.all.staff.find((s) => s.id === id) || {}).name || "Barber";
const pounds = (v) => Math.round(parseFloat(String(v).replace(/[£,\s]/g, "")) * 100) || 0;
const penceIn = (p) => (p / 100).toFixed(2).replace(/\.00$/, "");
const first = (n) => String(n || "").trim().split(/\s+/)[0];
const fmtDT = (iso) => new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(new Date(iso));
const ago = (iso) => { const d = Math.floor((Date.now() - new Date(iso)) / 864e5); return d < 1 ? "today" : d < 14 ? d + " days ago" : d < 60 ? Math.floor(d / 7) + " weeks ago" : Math.floor(d / 30) + " months ago"; };
const spin = '<div class="sp"><span class="spin"></span></div>';

/* ---------- sheet ---------- */
const openSheet = (html) => { const s = $("#sheet"); s.innerHTML = '<div class="grab"></div>' + html; s.scrollTop = 0; s.classList.add("open"); $("#bd").classList.add("open"); };
const closeSheet = () => { $("#sheet").classList.remove("open"); $("#bd").classList.remove("open"); };
const sheetOpen = () => $("#sheet").classList.contains("open");

/* ---------- lock ---------- */
let entry = "";
const drawDots = () => { $("#dots").innerHTML = Array.from({ length: Math.max(6, entry.length) }, (_, i) => `<i class="${i < entry.length ? "on" : ""}"></i>`).join(""); };
$("#pad").innerHTML = ["1","2","3","4","5","6","7","8","9","C","0","&#9003;"].map((k) => `<button class="${/\d/.test(k) ? "" : "s"}" data-k="${k}" aria-label="${k}">${k}</button>`).join("");
$("#pad").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return; const k = b.dataset.k;
  if (k === "C") entry = ""; else if (k === "⌫" || k === "&#9003;" || !/\d/.test(k)) entry = k === "C" ? "" : entry.slice(0, -1);
  else if (entry.length < 8) entry += k;
  $("#lerr").textContent = ""; drawDots();
});
document.addEventListener("keydown", (e) => {
  if ($("#lock").hidden) { if (e.key === "Escape") closeSheet(); return; }
  if (/^\d$/.test(e.key) && entry.length < 8) entry += e.key; else if (e.key === "Backspace") entry = entry.slice(0, -1); else if (e.key === "Enter") return tryLogin();
  drawDots();
});
$("#enter").onclick = () => tryLogin();
async function tryLogin(pin, silent) {
  pin = pin || entry; if (pin.length < 4) { $("#lerr").textContent = "Enter your PIN"; return; }
  const btn = $("#enter"); btn.disabled = true; S.pin = pin;
  try {
    const lr = await D.api("/admin/login", { method: "POST", body: {}, pin });
    S.me = lr.me || { role: "owner", name: "Owner" };
    lsSet(pin); await loadAll(); applyRole(); $("#lock").hidden = true; $("#app").hidden = false; entry = "";
    if (isBarber() && (S.tab === "menu" || S.tab === "settings")) S.tab = "diary";
    go(S.tab || "diary"); startAlerts();
  } catch (e) { S.pin = ""; if (e.status === 401) lsSet(""); if (!silent || e.status !== 401) $("#lerr").textContent = e.status === 401 ? "Wrong PIN" : e.message; entry = ""; drawDots(); }
  finally { btn.disabled = false; }
}
function lock(msg) { stopAlerts(); closePay(); S.me = null; E.data = null; E.staff = "all"; S.pin = ""; lsSet(""); entry = ""; drawDots(); closeSheet(); $("#app").hidden = true; $("#lock").hidden = false; $("#lerr").textContent = msg || ""; }
const loadAll = async () => { S.all = await call("/admin/all"); };

/* ---------- roles / header ---------- */
const isBarber = () => !!S.me && S.me.role === "barber";
const avatar = (st, cls) => st && st.photo ? `<img class="${cls}" src="${esc(st.photo)}" alt="" onerror="this.outerHTML='<span class=&quot;${cls}&quot;>${esc((st.name || '?')[0])}</span>'">` : `<span class="${cls}">${esc(((st || {}).name || "?")[0])}</span>`;
function applyRole() {

let AC = null;

function kaching() {

}

let cfRaf = 0;

  const c = $("#cf"), x = c.getContext("2d"); c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const cols = ["#c9a55a", "#e8cf8f", "#f4f1ea", "#b8892f"];
  const ps = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .42, vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 4, w: 6 + Math.random() * 7, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[(Math.random() * cols.length) | 0] }));
  const t0 = performance.now(); cancelAnimationFrame(cfRaf);

}

async function saveSet(btn, k) {
  const s = S.all.settings, v = (id) => $("#" + id).value;
  const save = (key, value) => call("/admin/settings", { method: "POST", body: { key, value } }).then(() => { s[key] = value; });
  await busy(btn, async () => {
    if (k === "hours") await save("hours", readHours($("#sh")));
    else if (k === "payment") { const r = $('input[name="pm"]:checked'); if (!r) throw new Error("Pick a payment option"); const dep = pounds(v("dep")); if (r.value === "deposit" && !dep) throw new Error("Enter a deposit amount"); await save("payment", { mode: r.value, deposit_pence: r.value === "deposit" ? dep : (s.payment || {}).deposit_pence || 0 }); }
    else if (k === "rules") { await save("lead_min", +v("lead") || 0); await save("slot_step", +v("step")); await save("window_days", +v("win") || 1); }
    else if (k === "business") { await save("business", { ...s.business, phone: v("b_phone"), whatsapp: v("b_whatsapp"), address: v("b_address"), instagram: v("b_instagram") }); await save("site_url", v("siteurl").trim()); }
    else if (k === "messages") await save("messages", { ...s.messages, confirm: v("m_confirm"), reminder: v("m_reminder"), rebook: v("m_rebook") });
    else if (k === "policy") await save("policy", v("pol"));
    D.toast("Saved");
  });
}

  savewalk: (el) => {
    const v = (i) => $("#" + i).value.trim();
    if (!v("ws") || !v("wn") || !v("wd") || !v("wt")) return D.toast("Barber, service, date, time and name are needed", true);
    const body = { service_id: v("ws"), staff_id: v("wb"), date: v("wd"), time: v("wt"), name: v("wn") };
    if (v("wp")) body.phone = v("wp"); if (v("wx")) body.notes = v("wx");
    const hint = { name: body.name, barber: staffName(body.staff_id), service: ($("#ws").selectedOptions[0].textContent || "").split(" \u00b7 ")[0] };
    busy(el, async () => {
      const r = await call("/admin/booking", { method: "POST", body }); D.toast("Booking saved"); closeSheet();
      S.day = body.date; if (D.addDays(S.strip, 13) < S.day || S.day < S.strip) S.strip = S.day; drawDiary(); await loadDay();
      let id = r.id || (r.booking && r.booking.id) || (r.bookings && r.bookings[0] && r.bookings[0].id);
      if (!id) { const m = S.bk.filter((b) => (b.customer || {}).name === body.name && b.time === body.time && b.staff_id === body.staff_id); id = m.length && m[m.length - 1].id; }
      if (id) openPay(id, hint);
    });
  },
  takepay: (el) => { const b = findB(el.dataset.id); openPay(el.dataset.id, { name: (b.customer || {}).name, barber: staffName(b.staff_id), service: b.service_name }); },
  paydone: () => payDone(),
  paycash: (el) => { const id = P.id, b = P.b; if (!id || !b) return; busy(el, async () => { await call("/admin/booking", { method: "POST", body: { id, paid_pence: b.price_pence } }); paySuccess(b.price_pence); }); },
  bndismiss: () => hideBanner(),
  estaff: (el) => { E.staff = el.dataset.id === E.staff ? "all" : el.dataset.id; loadEarn(true); },
  bar: (el) => showBar(el.dataset.d),
  cust: (el) => custSheet(el.dataset.id),
  due: () => { S.due = !S.due; $("#duechip").classList.toggle("on", S.due); drawClients(); },
  csv: () => csv(),
  savecust: (el) => busy(el, async () => { await call("/admin/customer", { method: "POST", body: { id: el.dataset.id, notes: $("#cn").value } }); S.cust.find((c) => c.id === el.dataset.id).notes = $("#cn").value; D.toast("Notes saved"); }),
  svc: (el) => svcSheet(el.dataset.id),
  stf: (el) => stfSheet(el.dataset.id),
  savesvc: (el) => {
    const v = (i) => $("#" + i).value.trim(), id = el.dataset.id;
    if (!v("sn")) return D.toast("Name needed", true);
    const body = { name: v("sn"), category: v("sc"), description: v("sx"), price_pence: pounds(v("sp")), price_from: $("#sf").checked, duration_min: +v("sd") || 30, staff_ids: $$(".sb:checked").map((c) => c.value), active: $("#sa").checked, sort: +v("so") || 0 };
    if (id) body.id = id;
    busy(el, async () => { await call("/admin/service", { method: "POST", body }); D.toast("Service saved"); closeSheet(); await reload(drawMenu); });
  },
  savestf: (el) => {
    const v = (i) => $("#" + i).value.trim(), id = el.dataset.id;
    if (!v("tn")) return D.toast("Name needed", true);
    const body = { name: v("tn"), role: v("tr"), bio: $("#tb").value, photo: v("tp"), instagram: v("ti"), active: $("#ta").checked, sort: +v("ts") || 0, hours: $("#tsame").checked ? null : readHours($("#th")) };
    if (id) body.id = id;
    const pin = $("#tpin").value.trim(); if (pin) { if (!/^\d{4,8}$/.test(pin)) return D.toast("Staff PIN must be 4 to 8 digits", true); body.pin = pin; }
    busy(el, async () => { await call("/admin/staff", { method: "POST", body }); D.toast("Barber saved"); closeSheet(); await reload(drawMenu); });
  },
  addblock: (el) => {
    const v = (i) => $("#" + i).value, body = { date: v("bd1"), reason: v("br").trim() || "Time off" };
    if (!body.date) return D.toast("Pick a date", true);
    if (v("bs")) body.staff_id = v("bs"); if (v("bd2")) body.to_date = v("bd2"); if (v("bf")) body.from = v("bf"); if (v("bt")) body.to = v("bt");
    busy(el, async () => { await call("/admin/block", { method: "POST", body }); D.toast("Time off added"); await reload(drawMenu); });
  },
  delblock: (el) => { if (confirm("Delete this time off?")) busy(el, async () => { await call("/admin/block", { method: "POST", body: { delete: el.dataset.id } }); D.toast("Deleted"); await reload(drawMenu); }); },
  saveset: (el) => saveSet(el, el.dataset.k),
  chpin: (el) => {
    const p = $("#np").value.trim(); if (!/^\d{4,8}$/.test(p)) return D.toast("PIN must be 4 to 8 digits", true);
    busy(el, async () => { await call("/admin/pin", { method: "POST", body: { pin: p } }); S.pin = p; lsSet(p); $("#np").value = ""; D.toast("PIN changed"); });
  },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) f(el);
});
document.addEventListener("input", (e) => {
  if (e.target.id === "tpin") e.target.value = e.target.value.replace(/\D/g, "");
  if (e.target.id === "cq") { S.cq = e.target.value; drawClients(); }
});
document.addEventListener("change", (e) => {
  const id = e.target.id;
  if (id === "cs") { S.csort = e.target.value; drawClients(); }
  if (id === "wb") fillWalkSvc();
  if (id === "tsame") $("#th").hidden = e.target.checked;
});

/* ---------- boot ---------- */
setInterval(() => { if (!document.hidden && S.pin && S.tab === "diary" && !sheetOpen()) loadDay(true); }, 60000);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#pay").classList.contains("open")) payDone(); });
drawDots(); $("#lock").hidden = false;
const saved = lsGet(); if (saved) tryLogin(saved, true);
})();
</script>
</body>
</html>
