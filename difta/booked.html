<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Booked | Do It For The Art Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 0}
.box{width:min(560px,100% - 32px);text-align:center}
.mark{width:120px;height:120px;border-radius:50%;margin:0 auto 26px;background:#0a0a0a url(img/mark-white.png) center/cover;box-shadow:0 0 0 1px rgba(201,165,90,.6),0 0 0 10px rgba(10,10,10,.6),0 0 0 11px rgba(201,165,90,.25)}
h1{font-size:clamp(44px,9vw,64px)}
h1 em{font-style:italic;color:var(--gold2)}
.ticket{margin:28px 0;padding:8px 24px;border-radius:24px;background:var(--panel);border:1px solid var(--line);text-align:left}
.ticket .row{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line2)}
.ticket .row:last-child{border:0}
.ticket .row span:first-child{color:var(--mute)}
.ticket .row span:last-child{text-align:right}
.ref{font:600 22px/1 var(--ui);letter-spacing:.2em;color:var(--gold2)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .btn{width:100%}
@media (max-width:480px){.acts{grid-template-columns:1fr}}
</style>
</head>
<body class="marble">
<div class="box" id="box"><div class="spin"></div><p class="muted" style="margin-top:14px">Confirming your booking…</p></div>
<script src="assets/common.js"></script>
<script>
(async () => {
  const D = DIFTA, $ = (s) => document.querySelector(s), id = new URLSearchParams(location.search).get("id");
  const fmtT = (hm) => { let [h, m] = hm.split(":").map(Number); return (h % 12 || 12) + ":" + String(m).padStart(2, "0") + (h >= 12 ? "pm" : "am"); };
  const box = $("#box");
  if (!id) { box.innerHTML = `<p>No booking found. <a class="gold" href="book.html">Book now</a></p>`; return; }
  let r, tries = 0;
  while (true) {
    try { r = await D.api("/booking?id=" + encodeURIComponent(id)); } catch (e) { box.innerHTML = `<h1>Hmm.</h1><p class="muted">We couldn't find that booking. Call 07946 683376 and we'll sort it.</p>`; return; }
    if (r.booking.status !== "pending" || tries++ > 10) break;
    await new Promise((ok) => setTimeout(ok, 2000));
  }
  const b = r.booking, ok = b.status === "confirmed" || b.status === "completed";
  if (!ok) {
    box.innerHTML = `<div class="mark"></div><h1>Not <em>confirmed.</em></h1><p class="muted" style="margin-top:12px">${b.status === "pending" ? "We're still waiting for the payment to come through. Refresh in a minute, or call us." : "This booking was not completed, so the slot was released."}</p><div style="margin-top:26px"><a class="btn gold" href="book.html">Book again</a></div>`;
    return;
  }
  const paid = b.paid_pence > 0, bal = b.price_pence - b.paid_pence;
  const start = new Date(b.start_at), end = new Date(b.end_at);
  const ics = (d) => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const icsTxt = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//DIFTA Studio//EN", "BEGIN:VEVENT", `UID:${b.id}@difta`, `DTSTAMP:${ics(new Date())}`, `DTSTART:${ics(start)}`, `DTEND:${ics(end)}`,
    `SUMMARY:${b.service} with ${b.barber} · DIFTA Studio`, "LOCATION:12 Wetherburn Court\\, Brunel Shopping Centre\\, Bletchley MK2 2UW", `DESCRIPTION:Booking ref ${b.ref}. Need to change? WhatsApp 07946 683376.`,
    "BEGIN:VALARM", "TRIGGER:-PT2H", "ACTION:DISPLAY", "DESCRIPTION:Trim at DIFTA Studio", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const icsUrl = URL.createObjectURL(new Blob([icsTxt], { type: "text/calendar" }));
  const waMsg = `Hi DIFTA Studio, I've just booked ${b.service} with ${b.barber} on ${D.niceDate(b.date)} at ${fmtT(b.time)} (ref ${b.ref}).`;
  box.innerHTML = `
    <div class="mark"></div>
    <div class="eyebrow">You're booked in</div>
    <h1>See you <em>${D.dayName(b.date) === D.dayName(D.ymd()) && b.date === D.ymd() ? "later" : D.dayName(b.date)}.</em></h1>
    <div class="ticket">
      <div class="row"><span>Service</span><span>${D.esc(b.service)}</span></div>
      <div class="row"><span>Barber</span><span>${D.esc(b.barber)}</span></div>
      <div class="row"><span>When</span><span>${D.niceDate(b.date)}, ${fmtT(b.time)}</span></div>
      <div class="row"><span>${paid ? (b.pay_mode === "demo" ? "Paid (demo)" : "Paid") : "Pay in studio"}</span><span>${paid ? D.gbp(b.paid_pence) + (bal > 0 ? ` <small class="muted">(${D.gbp(bal)} in studio)</small>` : " ✓") : D.gbp(b.price_pence)}</span></div>
      <div class="row"><span>Reference</span><span class="ref">${D.esc(b.ref)}</span></div>
    </div>
    <div class="acts">
      <a class="btn gold" href="${icsUrl}" download="DIFTA-${b.ref}.ics">Add to calendar</a>
      <a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=51.9946273,-0.7328365" target="_blank" rel="noopener">Directions</a>
      <a class="btn" href="${D.wa("447946683376", waMsg)}" target="_blank" rel="noopener">WhatsApp us</a>
      <a class="btn" href="index.html">Back to the studio</a>
    </div>
    ${D.DEMO ? `<button class="btn block" id="seeWa" style="margin-top:10px;border-color:#25d366;color:#9ff0bd">See the WhatsApp confirmation you'd get</button>` : ""}
    <p class="muted" style="font-size:13px;margin-top:22px">12 Wetherburn Court, Brunel Shopping Centre, Bletchley MK2 2UW.<br>Need to change? Message us at least 24 hours before.</p>`;
  if (D.DEMO) {
    const conf = `Hi ${(b.customer_first || "there")}, you're booked in at Do It For The Art Studio ✂️\n${b.service} with ${b.barber}\n${D.niceDate(b.date)} at ${fmtT(b.time)}\nRef ${b.ref}\n12 Wetherburn Court, Bletchley MK2 2UW\nSee you then!`;
    const show = () => D.waPreview(conf, "DIFTA Studio", true);
    document.getElementById("seeWa").onclick = show;
    setTimeout(show, 1200);
  }
})();
</script>
</body>
</html>
